<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object 2</title>
    <style>
        .area {
            border: 1px solid;
            width:700px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h3>* 객체의 속성 추가 / 삭제</h3>
    <div class="area" id="area1"></div>

    <button onclick="test1();">실행확인</button>

    <script>
        function test1() {
            const student = {}; // 빈 객체 생성

            // 객체에 속성 추가
            student.name = '이정재';
            student.hobby = ['씨름','싸움'];
            student.dream = '경찰';
            student.age = 22;

            // 속성이 있다면 덮어쓰고, 그렇지 않다면 새로 추가한다
            student.dream = '형사';

            // 메소드 추가
            student.toString = function() {
                const str = `name : ${this.name}<br>
                             hobby : ${this.hobby}<br>
                             dream : ${this.dream}<br>
                             age : ${this.age}<br>`;

                return str;
            }
            console.log(student);

            document.getElementById('area1').innerHTML+=`student : ${student}<hr>`;

            // 속성 삭제하기
            delete(student.hobby);
            document.getElementById('area1').innerHTML+=`student : ${student}`;
        }
    </script>
</body>
</html>
