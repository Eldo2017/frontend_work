<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Element 3</title>
</head>
<body>
    <h3>* 필터 관련 선택자</h3>

    <table border="1">
        <tr>
            <th>이름</th>
            <th>혈액형</th>
            <th>주소</th>
        </tr>
        <tr>
            <td>임상준</td>
            <td>A형</td>
            <td>경기도 용인시</td>
        </tr>
        <tr>
            <td>이효진</td>
            <td>B형</td>
            <td>충청남도 마산시</td>
        </tr>
        <tr>
            <td>유용욱</td>
            <td>AB형</td>
            <td>서울시 송파구</td>
        </tr>
        <tr>
            <td colspan="2">총 인원</td>
            <td>3명</td>
        </tr>
    </table>

    <script>
        $(() => {
            $('tr:first').css({backgroundColor:'darkcyan',color:'white'});
            $('tr:last').css({backgroundColor:'skyblue',color:'black'});
            $('tr:even').css({backgroundColor:'deeppink',color:'white'});
            $('tr:odd').css({backgroundColor:'gold',color:'black'});
        })
    </script>

    <h3>* 필터링 관련 메소드</h3>

    <p>
        기준이 되는 요소 중 특정 요소만 선택한다<br>
        first(), last(), filter(), eq(), not()
    </p>

    <h4 class="test">test1</h4>
    <h4 class="test">test2</h4>
    <h4 class="test">test3</h4>
    <h4 class="test">test4</h4>
    <h4 class="test">test5</h4>
    <h4>test6</h4>

    <script>
        $(() => {
            $('h4').first().css('font-size','20px');
            $('h4').last().css('font-size','40px');

            $('h4').filter('.test').html('<i>글자 바뀜</i>'); // innerhtml과 유사
            $('h4').not('.test').css('color','darkblue');

            $('h4').eq(2).text('<i>사딸라</i>'); // innertext와 유사
        })
    </script>
</body>
</html>
